[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-preprocess"
version = "0.1.0"
description = "Account Management Review document preprocessing pipeline and eval harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "extract-msg>=0.48",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docling = ["docling>=2.0"]
ui = ["streamlit>=1.40"]

[project.scripts]
amr-preprocess = "amr_preprocess.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
